[package]
name = "i2v-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "i2v"
path = "src/main.rs"

[dependencies]
i2v-core = { path = "../i2v-core" }
vtracer.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
