name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        # Scoped to our own crates, not --workspace: vendor/vtracer (a path
        # dependency, deliberately not a workspace member — see
        # vendor/vtracer/VENDORED.md) still gets its source lint-checked by
        # Cargo when building against it either way, but its own remaining
        # findings are suppressed at the crate root there, not re-litigated
        # here.
        run: cargo clippy -p i2v-core -p i2v-cli -p i2v-bench --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace
      - name: bench (quality gate — fails on any regression vs. vanilla VTracer)
        run: cargo run -p i2v-bench
